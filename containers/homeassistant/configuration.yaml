# Mounted read-only at /config/configuration.yaml — edit here and rebuild.
# Home Assistant creates this file once at onboarding and then leaves it alone,
# so it is safe to own from nix. Changes made inside HA will not persist.

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Home Assistant sits behind traefik, which reaches it across the podman bridge.
# Without this it rejects every proxied request with "400: Bad Request".
# The subnet rather than traefik's current address (10.88.0.13 today) because
# podman reassigns that whenever the container is recreated.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.88.0.0/16
